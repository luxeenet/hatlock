[package]
name = "hatlock-agent"
version = "1.0.0"
edition = "2021"
authors = ["Luxeenet Engineering <dev@luxeenet.com>"]
description = "HatLock Linux Device Protection and Financing Agent"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
signature = "2.2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
anyhow = "1.0"
thiserror = "1.0"
