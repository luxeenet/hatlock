# ==============================================================================
# HatLock by Luxeenet — Production Nginx Reverse Proxy Configuration
# Target Host: Ubuntu 24.04 VPS
# Path: /etc/nginx/sites-available/hatlock.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. API Gateway (Fastify Backend) -> 127.0.0.1:3000
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.luxeenet.com;

    client_max_body_size 50M;
    keepalive_timeout 65;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Connection & WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for mobile money push / webhook processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
