name: hatlock

services:
  # -------------------------------------------------------------
  # Database: PostgreSQL 16 with durable storage
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hatlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hatlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hatlock_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hatlock_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hatlock} -d ${POSTGRES_DB:-hatlock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Cache & Queues: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hatlock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend API: Fastify + Prisma + TypeScript
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hatlock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hatlock}:${POSTGRES_PASSWORD:-hatlock_dev_pass_2026}@postgres:5432/${POSTGRES_DB:-hatlock_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-hatlock-luxeenet-2026-xyz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-hatlock-luxeenet-2026-abc}
      HATPESA_API_KEY: ${HATPESA_API_KEY:-hp_test_key_luxeenet}
      HATPESA_API_SECRET: ${HATPESA_API_SECRET:-hp_test_secret_luxeenet}
      HATPESA_WEBHOOK_SECRET: ${HATPESA_WEBHOOK_SECRET:-hp_test_webhook_secret_luxeenet}
      SONICPESA_API_KEY: ${SONICPESA_API_KEY:-}
      SONICPESA_API_SECRET: ${SONICPESA_API_SECRET:-}
      SONICPESA_WEBHOOK_SECRET: ${SONICPESA_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"

  # -------------------------------------------------------------
  # Business Admin Web Dashboard: Next.js 14
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hatlock-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3002:3002"

  # -------------------------------------------------------------
  # Customer Self-Service Portal: Next.js 14
  # -------------------------------------------------------------
  customer-portal:
    build:
      context: .
      dockerfile: apps/customer-portal/Dockerfile
    container_name: hatlock-customer-portal
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    name: hatlock_postgres_data
  redis_data:
    name: hatlock_redis_data
