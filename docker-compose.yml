name: hatlock

services:
  # -------------------------------------------------------------
  # Database: PostgreSQL 16 with durable storage (internal only)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hatlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hatlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hatlock_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hatlock_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hatlock} -d ${POSTGRES_DB:-hatlock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Cache & Queues: Redis 7 (internal only)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hatlock-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend API: Fastify + Prisma + TypeScript
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hatlock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hatlock}:${POSTGRES_PASSWORD:-hatlock_dev_pass_2026}@postgres:5432/${POSTGRES_DB:-hatlock_db}?schema=public
      REDIS_URL: redis://redis:6379
      API_BASE_URL: ${API_BASE_URL:-https://api.luxeenet.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.luxeenet.com,https://portal.luxeenet.com}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------
  # Business Admin Web Dashboard: Next.js 14
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.luxeenet.com}
    container_name: hatlock-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.luxeenet.com}
    ports:
      - "127.0.0.1:3002:3002"

  # -------------------------------------------------------------
  # Customer Self-Service Portal: Next.js 14
  # -------------------------------------------------------------
  customer-portal:
    build:
      context: .
      dockerfile: apps/customer-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.luxeenet.com}
    container_name: hatlock-customer-portal
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.luxeenet.com}
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
    name: hatlock_postgres_data
  redis_data:
    name: hatlock_redis_data
